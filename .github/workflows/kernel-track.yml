name: Kernel Version Drift Monitor

on:
  schedule:
    # 每日一次 (UTC 03:00 / 北京时间 11:00)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      baseline_path:
        description: 'Custom baseline file path (optional, relative to workspace)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  track-kernel:
    name: Check Kernel Drift & Upstream Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Kernel Track Pipeline
        id: track
        working-directory: Browserapp
        env:
          CUSTOM_BASELINE: ${{ github.event.inputs.baseline_path }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=""
          if [[ -n "$CUSTOM_BASELINE" ]]; then
            EXTRA_ARGS="--baseline $CUSTOM_BASELINE"
          fi
          node scripts/kernel-track.mjs --ci $EXTRA_ARGS
