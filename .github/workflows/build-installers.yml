name: Build OpenBrowser installers

# Product policy:
# - macOS x86_64 / macOS arm64 / Windows x86_64 / Ubuntu x86_64 ship WITH integrated kernels by default
# - four platform jobs are independent (no shared cancel group, no fail-fast chain)
# - each finished platform uploads its own assets to the same GitHub Release immediately

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create, for example v1.0.21'
        required: true
        default: 'v1.0.21'
      prerelease:
        description: 'Mark the GitHub Release as a prerelease'
        required: false
        type: boolean
        default: false
      target_platform:
        description: 'Build all platforms for an official release (recommended), or one platform for draft-only diagnostics.'
        required: false
        type: choice
        default: all
        options:
          - windows-x86_64
          - macos-x86_64
          - macos-arm64
          - linux-x86_64
          - all

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  GH_TOKEN: ${{ github.token }}
  OPENBROWSER_PACKAGE_VARIANT: with-kernel
  OPENBROWSER_BUNDLE_KERNEL: 'true'
  RELEASE_NOTES: |
    ## OpenBrowser ${{ inputs.release_tag }} (**v1.0.21**)

    ### 中文

    - **版本标识与同步**：本发布版本统一为 **v1.0.21**，严格同步前端界面显示版本、npm 包版本、Windows 可执行文件与产品版本元数据、项目文档徽章及 CI/CD 工作流定义。
    - **字体指纹出口全面闭环（P0）**：Canvas 与 OffscreenCanvas 的 `measureText`、DOM 元素尺寸（`offsetWidth`/`getBoundingClientRect`/`getClientRects`）、Range 布局测量、SVG `getComputedTextLength`/`getBBox`、`document.fonts.check` 与 `document.fonts.load` 全部纳入外平台字体脱敏；修复 `FontFace` 构造函数按 `local()` 真实目标名解析的致命反转（此前误用外层别名判定，导致正规字体被拒、宿主专属字体反而放行）；消除读取 `FontFace.loaded` 时突变 `status` 的规范违规副作用。
    - **CSSOM 回显保真**：`style.textContent`/`innerHTML`/`innerText`、`CSSRule.cssText`、`CSSStyleDeclaration.cssText` 与 `getPropertyValue('src')` 一律回显调用方原始输入，杜绝被改写的内部占位符反向暴露注入痕迹；DedicatedWorker 字体层与主线程语义完全同构。
    - **媒体轨道标签防泄漏（P0）**：`MediaStreamTrack.label`、`getSettings().deviceId`、`track.clone()`/`stream.clone()` 与 `enumerateDevices()` 严格同源，彻底封堵 `getUserMedia` 返回真实物理硬件名称的穿透路径，同时保持 WebIDL 品牌检查与 `Illegal invocation` 错误类型不变。
    - **Worker WebGPU 去 Proxy 化（P1）**：DedicatedWorker 的 WebGPU 伪装改为原型访问器 + WeakMap 实现并保留品牌校验；Proxy 包装会破坏 WebIDL 内部私有槽，使 `GPUAdapter.prototype.info.call(adapter)` 抛出 `Illegal invocation`，这本身就是一个可被直接识别的破绽。
    - **时区一致性（P0）**：`engine.js` 接入 `resolveProfileTimezone`，当出口探测只返回国家码而缺少 IANA 时区时也能推导并注入 `--time-zone-for-testing`，杜绝内核 ICU/V8 裸奔在宿主真实时区而启动页显示代理国时区的时间双面人。
    - **代理 Fail-Closed（P0）**：代理未就绪时默认阻断启动，不再静默回落直连导致真实公网 IP 暴露；如需回落必须显式开启 `allowDirectFallback`，界面选项同时标注"真实 IP 暴露风险"。
    - **启动注入屏障 Fail-Closed**：指纹注入失败改为有限重试，重试仍失败时不再导航用户目标站点，改为本地安全错误页并显式上报，避免未伪装的原生指纹裸奔。
    - **Profile Local State 双写（P1）**：启动前原子写入 `<root>/Local State` 的 `intl.app_locale` 并执行读回校验，补齐 Chromium 最早期 App Locale 读取路径，与 `Default/Preferences` 保持一致。
    - **多窗口同步特权页降级**：`chrome://` 等特权内部页在多窗口同步中仅做 URL 镜像，不再注入 DOM 脚本或注册 `Runtime.addBinding`；内部页白名单补齐至与主进程一致的 19 项。
    - **代理域名解析走 DoH（P1）**：代理服务商域名优先经 DoH 解析，避免本地 ISP DNS 泄漏；DoH 端点不可达时输出响亮告警并降级系统解析，既不静默泄漏、也不会让受限网络下的代理直接不可用。
    - **应用中心下架冲突扩展**：移除 Canvas Defender、WebRTC Control、Spoof Timezone、AudioContext Defender 四个推荐项，避免第三方扩展在 DOM 层重复改写 Canvas/时区/WebRTC 与内核指纹注入互相打架（Canvas Defender 在官方商店已下架）。
    - **操作栏与平台 UI 修复**：操作栏 4 个按钮改用内联同步 SVG 兜底，浏览器内核图标固定 256×256 矢量且不裁切；macOS 下隐藏对其无效的"关闭行为"设置卡片。
    - **发布门禁扩容**：核心阻断回归套件由 56 项扩充至 64 项，新增"Fingerprint Hardening & Security Barriers"功能域，把字体出口、媒体轨道标签、Worker WebGPU、DoH、Local State 与 Fail-Closed 启动纳入强制门禁。
    - **架构边界披露（内核层范围 / 平台边界）**：TLS Client Hello 与 JA4 指纹、系统级 DNS 解析管线位于 Chromium C++ 网络栈内部，本版本不做脆弱的 JS 层模拟；缺失 CJK 字形仍由系统字体栈原生回退，不做合成 Canvas 度量；`chrome://` 特权页面受安全沙箱约束保持仅镜像。以上均以 WARN（架构边界）如实标注，绝不伪装为 PASS。

    ### English

    - **Version Alignment & Synchronization**: Formally released as **v1.0.21**, synchronized end-to-end across UI display labels, npm package definitions, Windows PE file and product version metadata, documentation badges, and CI/CD workflow manifests.
    - **Font Fingerprint Exit Closure (P0)**: Canvas/OffscreenCanvas `measureText`, DOM element metrics (`offsetWidth`/`getBoundingClientRect`/`getClientRects`), Range layout measurement, SVG `getComputedTextLength`/`getBBox`, and `document.fonts.check`/`load` are now all shielded against foreign-platform families. Fixed a critical inversion where the `FontFace` constructor matched the outer alias instead of the real `local()` target (foreign fonts were admitted while legitimate persona fonts were rejected); removed the spec-violating side effect where merely reading `FontFace.loaded` mutated `status`.
    - **CSSOM Echo Fidelity**: `style.textContent`/`innerHTML`/`innerText`, `CSSRule.cssText`, `CSSStyleDeclaration.cssText`, and `getPropertyValue('src')` now echo the caller's original input, so rewritten internal placeholders can no longer expose the injection layer; DedicatedWorker font behaviour is strictly isomorphic to the main thread.
    - **Media Track Label Containment (P0)**: `MediaStreamTrack.label`, `getSettings().deviceId`, `track.clone()`/`stream.clone()` are sourced from the same persona table as `enumerateDevices()`, closing the path where `getUserMedia` returned real physical hardware names, while preserving WebIDL brand checks and native `Illegal invocation` error types.
    - **Worker WebGPU De-Proxying (P1)**: DedicatedWorker WebGPU disguise now uses prototype accessors backed by a WeakMap with brand checks intact; a Proxy wrapper breaks WebIDL internal private slots, making `GPUAdapter.prototype.info.call(adapter)` throw `Illegal invocation` — a directly detectable tell.
    - **Timezone Consistency (P0)**: `engine.js` now uses `resolveProfileTimezone`, so `--time-zone-for-testing` is derived and injected even when the exit probe only returns a country code. This removes the split where the kernel ICU/V8 silently ran on the host timezone while the start page displayed the proxy country's zone.
    - **Proxy Fail-Closed (P0)**: A not-ready proxy now blocks startup by default instead of silently falling back to a direct connection that exposes the real public IP; falling back requires the explicit `allowDirectFallback` opt-in, and the UI option is labelled "real IP exposure risk".
    - **Startup Injection Barrier Fail-Closed**: Injection failure now retries a bounded number of times and, if it still fails, refuses to navigate to the user's target site, showing a local safety page and raising an explicit event instead of exposing an unspoofed native fingerprint.
    - **Profile Local State Dual-Write (P1)**: `intl.app_locale` is atomically written to `<root>/Local State` with read-back verification before spawn, covering Chromium's earliest App Locale read path and staying consistent with `Default/Preferences`.
    - **Privileged Internal Pages Downgraded in Sync**: `chrome://` internal pages are mirror-only in multi-window sync — no DOM script injection and no `Runtime.addBinding`; the internal-page allowlist is aligned to the 19 entries used by the main process.
    - **DoH for Proxy Hostname Resolution (P1)**: Proxy vendor hostnames resolve over DoH first to avoid local ISP DNS leakage; when the DoH endpoint is unreachable we emit a loud warning and degrade to the system resolver, so nothing leaks silently and restricted networks do not lose proxy connectivity.
    - **Conflicting Extensions Removed from App Center**: Canvas Defender, WebRTC Control, Spoof Timezone, and AudioContext Defender are no longer recommended — stacking third-party DOM-level Canvas/timezone/WebRTC rewrites on top of engine fingerprint injection breaks per-profile consistency (Canvas Defender is also delisted from the store).
    - **Action Bar & Platform UI Fixes**: The four action-bar buttons fall back to synchronous inline SVG, the browser engine icon is a fixed unclipped 256x256 vector, and the close-behaviour card is hidden on macOS where it has no effect.
    - **Release Gate Expansion**: Core blocking regression suites grew from 56 to 64 with a new "Fingerprint Hardening & Security Barriers" domain, gating font exits, media track labels, Worker WebGPU, DoH, Local State, and fail-closed startup.
    - **Architectural Boundary Disclosure (Kernel-Layer Scope)**: TLS Client Hello and JA4 fingerprints, plus system-level DNS resolution pipelines, live inside Chromium's C++ network stack; this release does not attempt fragile JavaScript-level emulation for transport traits. Missing CJK glyphs still fall back natively through the system font stack without synthetic Canvas metric manipulation, and privileged `chrome://` URLs remain mirror-only under security sandbox policies. These are reported as WARN (architectural boundary) and are never mislabelled as PASS.

    ### 下载 / Downloads

    | 标签 / Tag | 文件 / File |
    | --- | --- |
    | **Windows x86_64 · 内置内核** | `OpenBrowser-Windows-x86_64-with-kernel.exe` |
    | **Windows x86_64 · 便携包** | `OpenBrowser-Windows-x86_64-with-kernel.zip` |
    | **macOS x86_64 · 内置内核** | `OpenBrowser-macOS-x86_64.dmg` |
    | **macOS arm64 · 内置内核** | `OpenBrowser-macOS-arm64-with-kernel.dmg` |
    | **Ubuntu x86_64 · 内置内核** | `OpenBrowser-Linux-x86_64-with-kernel.tar.gz` |

    > 标签说明：`with-kernel` = 安装包内置独立浏览器内核，运行时无需再下载内核。
jobs:
  ensure-release:
    name: Ensure GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release tag matches packaged application version
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v$(node -p 'require("./Browserapp/package.json").version')"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag must match Browserapp/package.json version: expected $expected_tag, got $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Create or update release shell
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/openbrowser-release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          if gh release view "$RELEASE_TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" -R "$GH_REPO" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to mutate an already-published release; create a new release tag instead." >&2
              exit 1
            fi
            edit_args=("$RELEASE_TAG" --repo "$GH_REPO" --draft --title "OpenBrowser $RELEASE_TAG" --notes-file "$notes_file")
            if [[ "${{ inputs.prerelease }}" == "true" ]]; then
              edit_args+=(--prerelease)
            fi
            gh release edit "${edit_args[@]}"
          else
            args=("$RELEASE_TAG" --repo "$GH_REPO" --target "${{ github.sha }}" --draft --title "OpenBrowser $RELEASE_TAG" --notes-file "$notes_file")
            if [[ "${{ inputs.prerelease }}" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
            gh release view "$RELEASE_TAG" -R "$GH_REPO" >/dev/null
          fi

  windows-x86_64:
    name: Windows x86_64 (with kernel)
    needs: ensure-release
    if: ${{ inputs.target_platform == 'all' || inputs.target_platform == 'windows-x86_64' }}
    runs-on: windows-2022
    concurrency:
      group: openbrowser-installers-${{ inputs.release_tag }}-windows-x86_64
      cancel-in-progress: true
    defaults:
      run:
        working-directory: Browserapp
        shell: bash
    env:
      OPENBROWSER_PACKAGE_ARCH: x86_64
      OPENBROWSER_PACKAGE_VARIANT: with-kernel
      OPENBROWSER_BUNDLE_KERNEL: 'true'
    steps:
      # defaults.working-directory is Browserapp; before checkout use workspace root.
      - name: Enable Windows long paths for git
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          git config --global core.longpaths true
          try {
            New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
          } catch {
            Write-Host "LongPathsEnabled registry write skipped: $_"
          }
      - uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout: |
            /*
            !/Browserapp/kernels/macos-x64/
            !/Browserapp/kernels/macos-arm64/
            !/Browserapp/kernels/openbrowser/
          sparse-checkout-cone-mode: false
      - name: Prune foreign kernels
        run: rm -rf kernels/macos-x64 kernels/macos-arm64 kernels/openbrowser kernels/wayfern/macos-arm64 kernels/wayfern/macos-x64 || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Browserapp/package-lock.json
      - run: npm ci --include=dev
      - name: Verify kernel seed
        run: |
          set -euo pipefail
          test -f kernels/windows-x64/chrome.exe
          test -f kernels/windows-x64/chrome.dll
          npm run prepare:bundled-kernel
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress --yes
      - name: Self-tests
        run: |
          npm run selftest
          npm run selftest:automation
          npm run selftest:protocol
          npm run selftest:isolation
          npm run selftest:kernel
          npm run selftest:profileui
          npm run selftest:kernelinit
          npm run selftest:fpcoverage
          npm run selftest:fontnative
          npm run selftest:stealth
      - run: npm run package:portable
      - name: Verify package
        run: |
          set -euo pipefail
          STEM="OpenBrowser-Windows-x86_64-with-kernel"
          APP="dist/${STEM}/runtime/resources/app"
          test -f "$APP/kernels/windows-x64/chrome.exe"
          test -f "$APP/kernels/windows-x64/chrome.dll"
          test ! -e "$APP/kernels/macos-x64"
          test ! -e "$APP/kernels/macos-arm64"
          test -f "dist/${STEM}.zip"
          test -f "dist/${STEM}.exe"
      - name: Upload to release
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/openbrowser-release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          bash scripts/publish-release.sh "$RELEASE_TAG" "$notes_file" \
            dist/OpenBrowser-Windows-x86_64-with-kernel.exe \
            dist/OpenBrowser-Windows-x86_64-with-kernel.zip

  linux-x86_64:
    name: Ubuntu x86_64 (with Google Chrome Stable)
    needs: ensure-release
    if: ${{ inputs.target_platform == 'all' || inputs.target_platform == 'linux-x86_64' }}
    runs-on: ubuntu-22.04
    concurrency:
      group: openbrowser-installers-${{ inputs.release_tag }}-linux-x86_64
      cancel-in-progress: true
    defaults:
      run:
        working-directory: Browserapp
        shell: bash
    env:
      OPENBROWSER_PACKAGE_ARCH: x86_64
      OPENBROWSER_PACKAGE_VARIANT: with-kernel
      OPENBROWSER_BUNDLE_KERNEL: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout: |
            /*
            !/Browserapp/kernels/macos-x64/
            !/Browserapp/kernels/macos-arm64/
            !/Browserapp/kernels/windows-x64/
            !/Browserapp/kernels/openbrowser/
            !/Browserapp/kernels/wayfern/
          sparse-checkout-cone-mode: false
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes unzip xvfb libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libcups2 libdrm2 libgbm1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxrandr2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Browserapp/package-lock.json
      - run: npm ci --include=dev
      - name: Prepare and verify Google Chrome Stable seed
        run: |
          set -euo pipefail
          npm run prepare:linux-kernel
          OPENBROWSER_VERIFY_PLATFORM=linux-x64 npm run prepare:bundled-kernel
      - name: Self-tests
        run: |
          npm run selftest
          npm run selftest:automation
          npm run selftest:protocol
          npm run selftest:isolation
          npm run selftest:kernel
          npm run selftest:profileui
          npm run selftest:kernelinit
          npm run selftest:fpcoverage
          npm run selftest:fontnative
          npm run selftest:stealth
      - run: npm run package:portable
      - name: Verify Ubuntu package and bundled kernel
        run: |
          set -euo pipefail
          STEM="OpenBrowser-Linux-x86_64-with-kernel"
          PACKAGE="dist/${STEM}"
          APP="$PACKAGE/runtime/resources/app"
          KERNEL="$APP/kernels/chrome-stable/opt/google/chrome/chrome"
          test -x "$PACKAGE/OpenBrowser"
          test -x "$KERNEL"
          test -f "dist/${STEM}.tar.gz"
          test ! -e "$APP/kernels/windows-x64"
          test ! -e "$APP/kernels/macos-x64"
          test ! -e "$APP/kernels/macos-arm64"
          TEST_DATA="$RUNNER_TEMP/openbrowser-stable-smoke"
          "$KERNEL" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=0 --user-data-dir="$TEST_DATA" about:blank >"$RUNNER_TEMP/openbrowser-stable.log" 2>&1 &
          stable_pid=$!
          trap 'kill "$stable_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            test -f "$TEST_DATA/DevToolsActivePort" && break
            sleep 0.25
          done
          test -f "$TEST_DATA/DevToolsActivePort"
          kill "$stable_pid"
          wait "$stable_pid" || true
          trap - EXIT
      - name: Upload to release
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/openbrowser-release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          bash scripts/publish-release.sh "$RELEASE_TAG" "$notes_file" \
            dist/OpenBrowser-Linux-x86_64-with-kernel.tar.gz

  macos-x86_64:
    name: macOS x86_64 (with kernel)
    needs: ensure-release
    if: ${{ inputs.target_platform == 'all' || inputs.target_platform == 'macos-x86_64' }}
    runs-on: macos-15-intel
    concurrency:
      group: openbrowser-installers-${{ inputs.release_tag }}-macos-x86_64
      cancel-in-progress: true
    defaults:
      run:
        working-directory: Browserapp
        shell: bash
    env:
      OPENBROWSER_PACKAGE_ARCH: x86_64
      OPENBROWSER_PACKAGE_VARIANT: with-kernel
      OPENBROWSER_BUNDLE_KERNEL: 'true'
      OPENBROWSER_MAC_DMG_FORMAT: ULMO
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout: |
            /*
            !/Browserapp/kernels/windows-x64/
            !/Browserapp/kernels/macos-arm64/
            !/Browserapp/kernels/wayfern/
          sparse-checkout-cone-mode: false
      - name: Prune foreign kernels
        run: rm -rf kernels/windows-x64 kernels/macos-arm64 kernels/wayfern || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Browserapp/package-lock.json
      - run: npm ci --include=dev
      - name: Verify kernel seed
        run: |
          set -euo pipefail
          BIN="kernels/macos-x64/chrome_148/openbrowser_148/OpenBrowser.app/Contents/MacOS/OpenBrowser"
          test -f "$BIN"
          test -f "${BIN}.bin"
          chmod +x "$BIN" "${BIN}.bin" || true
          npm run prepare:bundled-kernel
      - name: Self-tests
        run: |
          npm run selftest
          npm run selftest:automation
          npm run selftest:protocol
          npm run selftest:isolation
          npm run selftest:kernel
          npm run selftest:profileui
          npm run selftest:kernelinit
          npm run selftest:fpcoverage
          npm run selftest:fontnative
          npm run selftest:stealth
          npm run selftest:webglparams
          npm run selftest:surfacediff
          npm run selftest:mediae2e
          npm run selftest:popupe2e
          npm run selftest:doclifecycle
          npm run selftest:mobilefp
          npm run selftest:workerfp
          npm run selftest:workerscope
          npm run selftest:bluetooth
      - run: npm run package:portable
      - name: Verify package
        run: |
          set -euo pipefail
          APP="dist/OpenBrowser-macOS-x86_64/OpenBrowser.app/Contents/Resources/app"
          test -f "$APP/kernels/macos-x64/chrome_148/openbrowser_148/OpenBrowser.app/Contents/MacOS/OpenBrowser"
          test ! -e "$APP/kernels/windows-x64"
          test ! -e "$APP/kernels/macos-arm64"
          test -f "dist/OpenBrowser-macOS-x86_64.dmg"
          codesign --verify --deep --strict "dist/OpenBrowser-macOS-x86_64/OpenBrowser.app"
          codesign -dv --verbose=2 "dist/OpenBrowser-macOS-x86_64/OpenBrowser.app" | head -20 || true
      - name: Upload to release
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/openbrowser-release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          bash scripts/publish-release.sh "$RELEASE_TAG" "$notes_file" \
            dist/OpenBrowser-macOS-x86_64.dmg

  macos-arm64:
    name: macOS arm64 (with kernel)
    needs: ensure-release
    if: ${{ inputs.target_platform == 'all' || inputs.target_platform == 'macos-arm64' }}
    runs-on: macos-14
    concurrency:
      group: openbrowser-installers-${{ inputs.release_tag }}-macos-arm64
      cancel-in-progress: true
    defaults:
      run:
        working-directory: Browserapp
        shell: bash
    env:
      OPENBROWSER_PACKAGE_ARCH: arm64
      OPENBROWSER_PACKAGE_VARIANT: with-kernel
      OPENBROWSER_BUNDLE_KERNEL: 'true'
      OPENBROWSER_MAC_DMG_FORMAT: ULMO
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout: |
            /*
            !/Browserapp/kernels/macos-x64/
            !/Browserapp/kernels/windows-x64/
            !/Browserapp/kernels/openbrowser/
          sparse-checkout-cone-mode: false
      - name: Prune foreign kernels
        run: rm -rf kernels/macos-x64 kernels/windows-x64 kernels/openbrowser || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Browserapp/package-lock.json
      - run: npm ci --include=dev
      - name: Verify kernel seed
        run: |
          set -euo pipefail
          test -x kernels/macos-arm64/Wayfern.app/Contents/MacOS/Wayfern
          npm run prepare:bundled-kernel
      - name: Self-tests
        run: |
          npm run selftest
          npm run selftest:automation
          npm run selftest:protocol
          npm run selftest:isolation
          npm run selftest:kernel
          npm run selftest:profileui
          npm run selftest:kernelinit
          npm run selftest:fpcoverage
          npm run selftest:fontnative
          npm run selftest:stealth
          npm run selftest:webglparams
          npm run selftest:surfacediff
          npm run selftest:mediae2e
          npm run selftest:popupe2e
          npm run selftest:doclifecycle
          npm run selftest:mobilefp
          npm run selftest:workerfp
          npm run selftest:workerscope
          npm run selftest:bluetooth
      - run: npm run package:portable
      - name: Verify package
        run: |
          set -euo pipefail
          APP="dist/OpenBrowser-macOS-arm64-with-kernel/OpenBrowser.app/Contents/Resources/app"
          test -x "$APP/kernels/macos-arm64/Wayfern.app/Contents/MacOS/Wayfern"
          test ! -e "$APP/kernels/macos-x64"
          test ! -e "$APP/kernels/windows-x64"
          test -f "dist/OpenBrowser-macOS-arm64-with-kernel.dmg"
          codesign --verify --deep --strict "dist/OpenBrowser-macOS-arm64-with-kernel/OpenBrowser.app"
          codesign -dv --verbose=2 "dist/OpenBrowser-macOS-arm64-with-kernel/OpenBrowser.app" | head -20 || true
      - name: Upload to release
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/openbrowser-release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          bash scripts/publish-release.sh "$RELEASE_TAG" "$notes_file" \
            dist/OpenBrowser-macOS-arm64-with-kernel.dmg

  finalize-release:
    name: Publish completed release
    needs: [windows-x86_64, linux-x86_64, macos-x86_64, macos-arm64]
    if: ${{ inputs.target_platform == 'all' && needs.windows-x86_64.result == 'success' && needs.linux-x86_64.result == 'success' && needs.macos-x86_64.result == 'success' && needs.macos-arm64.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify draft assets and publish release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected_assets=(
            "OpenBrowser-Windows-x86_64-with-kernel.exe"
            "OpenBrowser-Windows-x86_64-with-kernel.zip"
            "OpenBrowser-Linux-x86_64-with-kernel.tar.gz"
            "OpenBrowser-macOS-x86_64.dmg"
            "OpenBrowser-macOS-arm64-with-kernel.dmg"
          )
          actual_assets="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name')"
          for asset in "${expected_assets[@]}"; do
            if ! grep -Fqx "$asset" <<<"$actual_assets"; then
              echo "Required release asset is missing: $asset" >&2
              exit 1
            fi
          done
          notes_file="$RUNNER_TEMP/openbrowser-release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          args=("$RELEASE_TAG" --repo "$GH_REPO" --draft=false --title "OpenBrowser $RELEASE_TAG" --notes-file "$notes_file")
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release edit "${args[@]}"
