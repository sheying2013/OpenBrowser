name: Build OpenBrowser installers

# Product policy:
# - macOS x86_64 / macOS arm64 / Windows x86_64 / Ubuntu x86_64 ship WITH integrated kernels by default
# - four platform jobs are independent (no shared cancel group, no fail-fast chain)
# - each finished platform uploads its own assets to the same GitHub Release immediately

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create, for example v1.0.2'
        required: true
        default: 'v1.0.15'
      prerelease:
        description: 'Mark the GitHub Release as a prerelease'
        required: false
        type: boolean
        default: false
      target_platform:
        description: 'Build one platform (recommended). Choose all for independent batch.'
        required: false
        type: choice
        default: windows-x86_64
        options:
          - windows-x86_64
          - macos-x86_64
          - macos-arm64
          - linux-x86_64
          - all

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  GH_TOKEN: ${{ github.token }}
  OPENBROWSER_PACKAGE_VARIANT: with-kernel
  OPENBROWSER_BUNDLE_KERNEL: 'true'
  RELEASE_NOTES: |
    ## OpenBrowser ${{ inputs.release_tag }}

    ### 中文

    - **macOS WebGL 渲染器格式修正**：macOS 预设中有三条仍在使用 Chrome 111 之前的形态（如 `ANGLE (Apple, Apple M1, OpenGL 4.1)`）。Chrome 自 111 起在 macOS 全面改用 ANGLE 的 Metal 后端，当前版本真实输出为 `ANGLE (Apple, ANGLE Metal Renderer: Apple M1, Unspecified Version)`（已用本机 Chrome 实测确认）。旧形态与 UA 声称的 Chrome 版本自相矛盾，是可被直接判定的特征；现改为 Metal 形态，并保留每条预设原本对应的 GPU。
    - **回归加固**：新增断言要求未启用 persona 的 macOS profile 同样报告 Metal 形态；golden fixture 记录该一次性修正及其理由（与 deviceMemory 从 16 修正为 8 的既有先例一致）。
    - **版本全链路同步**：`package.json`、`package-lock.json`、界面显示、Windows 文件版本信息、README 徽章与 GitHub Actions 发布参数统一为 **v1.0.15**。

    ### English

    - **macOS WebGL renderer format corrected**: three macOS presets still used the pre-111 form (`ANGLE (Apple, Apple M1, OpenGL 4.1)`). Chrome moved macOS to the ANGLE Metal backend in 111, and a current build reports `ANGLE (Apple, ANGLE Metal Renderer: Apple M1, Unspecified Version)` (verified against a local Chrome build). The old form contradicted the Chrome version the UA claims and could be checked directly; the presets now use the Metal form while keeping the GPU each one named.
    - **Regression coverage**: an assertion now requires non-persona macOS profiles to report the Metal form as well, and the golden fixture records this one-time correction and its rationale (matching the existing precedent for navigator.deviceMemory 16 -> 8).
    - **Version synchronization**: `package.json`, `package-lock.json`, the in-app label, Windows metadata, README badges, and the GitHub Actions release input are all aligned to **v1.0.15**.

    ### 下载 / Downloads

    | 标签 / Tag | 文件 / File |
    | --- | --- |
    | **Windows x86_64 · 内置内核** | `OpenBrowser-Windows-x86_64-with-kernel.exe` |
    | **Windows x86_64 · 便携包** | `OpenBrowser-Windows-x86_64-with-kernel.zip` |
    | **macOS x86_64 · 内置内核** | `OpenBrowser-macOS-x86_64.dmg` |
    | **macOS arm64 · 内置内核** | `OpenBrowser-macOS-arm64-with-kernel.dmg` |
    | **Ubuntu x86_64 · 内置内核** | `OpenBrowser-Linux-x86_64-with-kernel.tar.gz` |

    > 标签说明：`with-kernel` = 安装包内置独立浏览器内核，运行时无需再下载内核。
jobs:
  ensure-release:
    name: Ensure GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release shell
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/openbrowser-release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          if gh release view "$RELEASE_TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            edit_args=("$RELEASE_TAG" --repo "$GH_REPO" --title "OpenBrowser $RELEASE_TAG" --notes-file "$notes_file")
            if [[ "${{ inputs.prerelease }}" == "true" ]]; then
              edit_args+=(--prerelease)
            fi
            gh release edit "${edit_args[@]}" || true
          else
            args=("$RELEASE_TAG" --repo "$GH_REPO" --target "${{ github.sha }}" --title "OpenBrowser $RELEASE_TAG" --notes-file "$notes_file")
            if [[ "${{ inputs.prerelease }}" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}" || true
            gh release view "$RELEASE_TAG" -R "$GH_REPO" >/dev/null
          fi

  windows-x86_64:
    name: Windows x86_64 (with kernel)
    needs: ensure-release
    if: ${{ inputs.target_platform == 'all' || inputs.target_platform == 'windows-x86_64' }}
    runs-on: windows-2022
    concurrency:
      group: openbrowser-installers-${{ inputs.release_tag }}-windows-x86_64
      cancel-in-progress: true
    defaults:
      run:
        working-directory: Browserapp
        shell: bash
    env:
      OPENBROWSER_PACKAGE_ARCH: x86_64
      OPENBROWSER_PACKAGE_VARIANT: with-kernel
      OPENBROWSER_BUNDLE_KERNEL: 'true'
    steps:
      # defaults.working-directory is Browserapp; before checkout use workspace root.
      - name: Enable Windows long paths for git
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          git config --global core.longpaths true
          try {
            New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
          } catch {
            Write-Host "LongPathsEnabled registry write skipped: $_"
          }
      - uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout: |
            /*
            !/Browserapp/kernels/macos-x64/
            !/Browserapp/kernels/macos-arm64/
            !/Browserapp/kernels/openbrowser/
          sparse-checkout-cone-mode: false
      - name: Prune foreign kernels
        run: rm -rf kernels/macos-x64 kernels/macos-arm64 kernels/openbrowser kernels/wayfern/macos-arm64 kernels/wayfern/macos-x64 || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Browserapp/package-lock.json
      - run: npm ci --include=dev
      - name: Verify kernel seed
        run: |
          set -euo pipefail
          test -f kernels/windows-x64/chrome.exe
          test -f kernels/windows-x64/chrome.dll
          npm run prepare:bundled-kernel
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress --yes
      - name: Self-tests
        run: |
          npm run selftest
          npm run selftest:automation
          npm run selftest:protocol
          npm run selftest:isolation
          npm run selftest:kernel
          npm run selftest:profileui
      - run: npm run package:portable
      - name: Verify package
        run: |
          set -euo pipefail
          STEM="OpenBrowser-Windows-x86_64-with-kernel"
          APP="dist/${STEM}/runtime/resources/app"
          test -f "$APP/kernels/windows-x64/chrome.exe"
          test -f "$APP/kernels/windows-x64/chrome.dll"
          test ! -e "$APP/kernels/macos-x64"
          test ! -e "$APP/kernels/macos-arm64"
          test -f "dist/${STEM}.zip"
          if [ ! -f "dist/${STEM}.exe" ]; then
            echo "WARN: NSIS installer missing; portable zip will be uploaded"
          fi
      - name: Upload to release
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/openbrowser-release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          assets=(dist/OpenBrowser-Windows-x86_64-with-kernel.zip)
          if [ -f dist/OpenBrowser-Windows-x86_64-with-kernel.exe ]; then
            assets=(dist/OpenBrowser-Windows-x86_64-with-kernel.exe dist/OpenBrowser-Windows-x86_64-with-kernel.zip)
          fi
          bash scripts/publish-release.sh "$RELEASE_TAG" "$notes_file" "${assets[@]}"

  linux-x86_64:
    name: Ubuntu x86_64 (with Google Chrome Stable)
    needs: ensure-release
    if: ${{ inputs.target_platform == 'all' || inputs.target_platform == 'linux-x86_64' }}
    runs-on: ubuntu-22.04
    concurrency:
      group: openbrowser-installers-${{ inputs.release_tag }}-linux-x86_64
      cancel-in-progress: true
    defaults:
      run:
        working-directory: Browserapp
        shell: bash
    env:
      OPENBROWSER_PACKAGE_ARCH: x86_64
      OPENBROWSER_PACKAGE_VARIANT: with-kernel
      OPENBROWSER_BUNDLE_KERNEL: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout: |
            /*
            !/Browserapp/kernels/macos-x64/
            !/Browserapp/kernels/macos-arm64/
            !/Browserapp/kernels/windows-x64/
            !/Browserapp/kernels/openbrowser/
            !/Browserapp/kernels/wayfern/
          sparse-checkout-cone-mode: false
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes unzip xvfb libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libcups2 libdrm2 libgbm1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxrandr2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Browserapp/package-lock.json
      - run: npm ci --include=dev
      - name: Prepare and verify Google Chrome Stable seed
        run: |
          set -euo pipefail
          npm run prepare:linux-kernel
          OPENBROWSER_VERIFY_PLATFORM=linux-x64 npm run prepare:bundled-kernel
      - name: Self-tests
        run: |
          npm run selftest
          npm run selftest:automation
          npm run selftest:protocol
          npm run selftest:isolation
          npm run selftest:kernel
          npm run selftest:profileui
      - run: npm run package:portable
      - name: Verify Ubuntu package and bundled kernel
        run: |
          set -euo pipefail
          STEM="OpenBrowser-Linux-x86_64-with-kernel"
          PACKAGE="dist/${STEM}"
          APP="$PACKAGE/runtime/resources/app"
          KERNEL="$APP/kernels/chrome-stable/opt/google/chrome/chrome"
          test -x "$PACKAGE/OpenBrowser"
          test -x "$KERNEL"
          test -f "dist/${STEM}.tar.gz"
          test ! -e "$APP/kernels/windows-x64"
          test ! -e "$APP/kernels/macos-x64"
          test ! -e "$APP/kernels/macos-arm64"
          TEST_DATA="$RUNNER_TEMP/openbrowser-stable-smoke"
          "$KERNEL" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=0 --user-data-dir="$TEST_DATA" about:blank >"$RUNNER_TEMP/openbrowser-stable.log" 2>&1 &
          stable_pid=$!
          trap 'kill "$stable_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            test -f "$TEST_DATA/DevToolsActivePort" && break
            sleep 0.25
          done
          test -f "$TEST_DATA/DevToolsActivePort"
          kill "$stable_pid"
          wait "$stable_pid" || true
          trap - EXIT
      - name: Upload to release
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/openbrowser-release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          bash scripts/publish-release.sh "$RELEASE_TAG" "$notes_file" \
            dist/OpenBrowser-Linux-x86_64-with-kernel.tar.gz

  macos-x86_64:
    name: macOS x86_64 (with kernel)
    needs: ensure-release
    if: ${{ inputs.target_platform == 'all' || inputs.target_platform == 'macos-x86_64' }}
    runs-on: macos-15-intel
    concurrency:
      group: openbrowser-installers-${{ inputs.release_tag }}-macos-x86_64
      cancel-in-progress: true
    defaults:
      run:
        working-directory: Browserapp
        shell: bash
    env:
      OPENBROWSER_PACKAGE_ARCH: x86_64
      OPENBROWSER_PACKAGE_VARIANT: with-kernel
      OPENBROWSER_BUNDLE_KERNEL: 'true'
      OPENBROWSER_MAC_DMG_FORMAT: ULMO
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout: |
            /*
            !/Browserapp/kernels/windows-x64/
            !/Browserapp/kernels/macos-arm64/
            !/Browserapp/kernels/wayfern/
          sparse-checkout-cone-mode: false
      - name: Prune foreign kernels
        run: rm -rf kernels/windows-x64 kernels/macos-arm64 kernels/wayfern || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Browserapp/package-lock.json
      - run: npm ci --include=dev
      - name: Verify kernel seed
        run: |
          set -euo pipefail
          BIN="kernels/macos-x64/chrome_148/openbrowser_148/OpenBrowser.app/Contents/MacOS/OpenBrowser"
          test -f "$BIN"
          test -f "${BIN}.bin"
          chmod +x "$BIN" "${BIN}.bin" || true
          npm run prepare:bundled-kernel
      - name: Self-tests
        run: |
          npm run selftest
          npm run selftest:automation
          npm run selftest:protocol
          npm run selftest:isolation
          npm run selftest:kernel
          npm run selftest:profileui
      - run: npm run package:portable
      - name: Verify package
        run: |
          set -euo pipefail
          APP="dist/OpenBrowser-macOS-x86_64/OpenBrowser.app/Contents/Resources/app"
          test -f "$APP/kernels/macos-x64/chrome_148/openbrowser_148/OpenBrowser.app/Contents/MacOS/OpenBrowser"
          test ! -e "$APP/kernels/windows-x64"
          test ! -e "$APP/kernels/macos-arm64"
          test -f "dist/OpenBrowser-macOS-x86_64.dmg"
          codesign --verify --deep --strict "dist/OpenBrowser-macOS-x86_64/OpenBrowser.app"
          codesign -dv --verbose=2 "dist/OpenBrowser-macOS-x86_64/OpenBrowser.app" | head -20 || true
      - name: Upload to release
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/openbrowser-release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          bash scripts/publish-release.sh "$RELEASE_TAG" "$notes_file" \
            dist/OpenBrowser-macOS-x86_64.dmg

  macos-arm64:
    name: macOS arm64 (with kernel)
    needs: ensure-release
    if: ${{ inputs.target_platform == 'all' || inputs.target_platform == 'macos-arm64' }}
    runs-on: macos-14
    concurrency:
      group: openbrowser-installers-${{ inputs.release_tag }}-macos-arm64
      cancel-in-progress: true
    defaults:
      run:
        working-directory: Browserapp
        shell: bash
    env:
      OPENBROWSER_PACKAGE_ARCH: arm64
      OPENBROWSER_PACKAGE_VARIANT: with-kernel
      OPENBROWSER_BUNDLE_KERNEL: 'true'
      OPENBROWSER_MAC_DMG_FORMAT: ULMO
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout: |
            /*
            !/Browserapp/kernels/macos-x64/
            !/Browserapp/kernels/windows-x64/
            !/Browserapp/kernels/openbrowser/
          sparse-checkout-cone-mode: false
      - name: Prune foreign kernels
        run: rm -rf kernels/macos-x64 kernels/windows-x64 kernels/openbrowser || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Browserapp/package-lock.json
      - run: npm ci --include=dev
      - name: Verify kernel seed
        run: |
          set -euo pipefail
          test -x kernels/macos-arm64/Wayfern.app/Contents/MacOS/Wayfern
          npm run prepare:bundled-kernel
      - name: Self-tests
        run: |
          npm run selftest
          npm run selftest:automation
          npm run selftest:protocol
          npm run selftest:isolation
          npm run selftest:kernel
          npm run selftest:profileui
      - run: npm run package:portable
      - name: Verify package
        run: |
          set -euo pipefail
          APP="dist/OpenBrowser-macOS-arm64-with-kernel/OpenBrowser.app/Contents/Resources/app"
          test -x "$APP/kernels/macos-arm64/Wayfern.app/Contents/MacOS/Wayfern"
          test ! -e "$APP/kernels/macos-x64"
          test ! -e "$APP/kernels/windows-x64"
          test -f "dist/OpenBrowser-macOS-arm64-with-kernel.dmg"
          codesign --verify --deep --strict "dist/OpenBrowser-macOS-arm64-with-kernel/OpenBrowser.app"
          codesign -dv --verbose=2 "dist/OpenBrowser-macOS-arm64-with-kernel/OpenBrowser.app" | head -20 || true
      - name: Upload to release
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/openbrowser-release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          bash scripts/publish-release.sh "$RELEASE_TAG" "$notes_file" \
            dist/OpenBrowser-macOS-arm64-with-kernel.dmg
