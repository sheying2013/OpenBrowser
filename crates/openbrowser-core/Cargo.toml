[package]
name = "openbrowser-core"
version = "1.0.26"
edition = "2021"
authors = ["OpenBrowser Team"]
description = "High-performance Rust core engine for OpenBrowser"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
socket2 = "0.5"
futures-util = "0.3"
async-trait = "0.1"
cfg-if = "1"
sha2 = "0.10"
md-5 = "0.10"
rand = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
tokio-test = "0.4"
